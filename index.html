<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="日本時間の日付で、今日の名言を一つだけ出す。"
    />
    <title>今日の名言・格言</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="mast">
        <time id="date"></time>
        <h1>今日の名言・格言</h1>
      </header>
      <main class="quote" aria-live="polite">
        <p id="quote-text" class="quote-text"></p>
        <p class="byline"><span id="speaker" class="speaker"></span></p>
        <p id="source" class="source"></p>
      </main>
      <div class="toolbar">
        <button type="button" id="another">別の名言</button>
        <div class="source-pick" role="group" aria-label="名言の出し方">
          <button type="button" data-source="stock" aria-pressed="false">
            ストック
          </button>
          <button type="button" data-source="net" aria-pressed="false">
            ネット
          </button>
          <button type="button" data-source="both" aria-pressed="true">
            両方
          </button>
        </div>
      </div>
    </div>
    <noscript>
      <p>今日の名言を出すには、JavaScript を有効にしてください。</p>
    </noscript>
    <script src="js/quotes.js"></script>
    <script src="js/today.js"></script>
    <script src="js/net.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
